<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSM ARENA — شاشة البث</title><link rel="stylesheet" href="style.css"><main><header class="top"><div class="brand"><img class="logo" src="assets/logo-original.jpg" alt="BSM"> BSM <span>ARENA</span></div><strong id="status" class="gold">بانتظار اللاعبين</strong></header><section class="stats panel"><div class="stat"><b id="count">0</b>متنافس</div><div class="stat"><b id="round">0</b>الجولة</div><div class="stat"><b id="out">0</b>مقصى</div><div class="stat"><b id="clock">—</b>الوقت</div></section><section class="panel center" id="stage"></section><section class="panel"><h2>المتنافسون</h2><div id="players" class="players"></div></section></main><script type="module">import{onState,remaining,timeLeft,safe}from './common.js';let s={};const $=id=>document.getElementById(id);onState(v=>{s=v;$('count').textContent=remaining(v).length;$('round').textContent=v.round;$('out').textContent=v.players.length-remaining(v).length;$('status').textContent=({lobby:'التسجيل مفتوح',question:'التحدي جارٍ',result:'نتائج الجولة',finished:'انتهت البطولة'})[v.phase];$('players').innerHTML=v.players.map(p=>`<div class="player ${p.alive?'':'out'}">${p.platform==='twitch'?'🟣':'🔴'} ${safe(p.name)} <span class="gold">${p.score} نقطة</span> ${p.shield?'🛡️':''}</div>`).join('');$('stage').innerHTML=v.phase==='lobby'?'<h1>انضم إلى ساحة الأبطال</h1><h2>Twitch: !انضم &nbsp; | &nbsp; TikTok: انضم</h2>':v.phase==='finished'?`<h1>🏆 بطل الساحة</h1><h1>${safe(v.winner||'لا أحد')}</h1>`:`<h2>الجولة ${v.round}</h2><h2 class="question">${safe(v.question?.q||'')}</h2><div class="options">${(v.question?.options||[]).map((o,i)=>`<div class="option">${i+1} — ${safe(o)}</div>`).join('')}</div><h2>${v.phase==='question'?'اكتب رقم الإجابة في الشات':'انتهت الجولة — انتظر الجولة التالية'}</h2>`});setInterval(()=>{$('clock').textContent=s.phase==='question'?timeLeft(s):'—'},200)</script></html>
