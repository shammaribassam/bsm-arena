<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSM ARENA — الإدارة</title><link rel="stylesheet" href="style.css"><main><header class="top"><div class="brand">⚔ BSM <span>ARENA</span></div><a href="viewer.html" target="_blank">افتح شاشة البث ↗</a></header><section class="panel"><h2>لوحة تحكم الستريمر</h2><label>مفتاح الإدارة <input id="key" type="password" placeholder="ADMIN_KEY" autocomplete="off"></label><button id="save">حفظ المفتاح لهذه الصفحة</button><p id="notice" class="muted">لا تشارك مفتاح الإدارة مع المتابعين.</p></section><section class="stats panel"><div class="stat"><b id="total">0</b>المشاركون</div><div class="stat"><b id="alive">0</b>الناجون</div><div class="stat"><b id="round">0</b>الجولة</div><div class="stat"><b id="phase">—</b>الحالة</div></section><div class="layout"><section class="panel"><h2>إدارة البطولة</h2><label>نوع اللعبة <select id="game"><option value="survival">آخر الناجين</option><option value="quiz">تحدي العباقرة</option><option value="duel">مواجهات (نظام أسئلة)</option><option value="fate">عجلة المصير (نظام أسئلة)</option></select></label><label>مدة الجولة بالثواني <input id="seconds" type="number" min="5" max="120" value="20"></label><button id="settings">حفظ الإعدادات</button><hr><button id="start">بدء البطولة</button><button id="reveal" class="secondary">إنهاء الجولة</button><button id="next">الجولة التالية</button><button id="reset" class="danger">بطولة جديدة</button><p class="muted">الإقصاء تلقائي لمن يخطئ أو لا يجيب، إذا أجاب لاعب واحد على الأقل بشكل صحيح.</p><p id="connection"></p></section><section class="panel"><h2>الأحداث المباشرة</h2><div id="events" class="muted"></div></section></div><section class="panel"><h2>إدارة المتسابقين</h2><div id="players" class="players"></div></section></main><script type="module">import{onState,remaining,safe}from './common.js';const $=id=>document.getElementById(id);$('key').value=sessionStorage.getItem('bsm_key')||'';$('save').onclick=()=>{sessionStorage.setItem('bsm_key',$('key').value);$('notice').textContent='تم حفظ المفتاح مؤقتًا في هذا التبويب'};async function send(action,extra={}){try{const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':$('key').value},body:JSON.stringify({action,...extra})});const d=await r.json();$('notice').textContent=d.error||'تم تنفيذ الأمر';if(!r.ok)throw Error(d.error)}catch(e){$('notice').textContent=e.message}}for(const a of ['start','reveal','next'])$(a).onclick=()=>send(a);$('reset').onclick=()=>{if(confirm('مسح جميع اللاعبين وبدء بطولة جديدة؟'))send('reset')};$('settings').onclick=()=>send('settings',{game:$('game').value,seconds:$('seconds').value});$('players').onclick=e=>{const b=e.target.closest('button[data-action]');if(b)send(b.dataset.action,{id:b.dataset.id,delta:Number(b.dataset.delta)||0})};onState(s=>{$('total').textContent=s.players.length;$('alive').textContent=remaining(s).length;$('round').textContent=s.round;$('phase').textContent=s.phase;$('connection').textContent=`Twitch: ${s.connected.twitch?'متصل':'غير متصل'} | TikTok bridge: ${s.connected.tiktok?'استقبل أحداثًا':'غير مثبت'}`;$('events').innerHTML=s.events.map(e=>`<p>${safe(e.text)}</p>`).join('');$('players').innerHTML=s.players.map(p=>`<div class="player ${p.alive?'':'out'}"><strong>${safe(p.name)}</strong> (${safe(p.platform)})<p>${p.score} نقطة ${p.shield?'🛡️':''}</p><button data-action="${p.alive?'eliminate':'revive'}" data-id="${safe(p.id)}" class="secondary">${p.alive?'إقصاء':'إرجاع'}</button><button data-action="shield" data-id="${safe(p.id)}">حصانة</button><button data-action="score" data-delta="10" data-id="${safe(p.id)}">+10</button><button data-action="score" data-delta="-10" data-id="${safe(p.id)}" class="secondary">-10</button></div>`).join('')})</script></html>
